allowBuilds:
  esbuild: true
  sharp: true

# Supply-chain hardening: only install versions published at least 14 days ago.
minimumReleaseAge: 20160
# Only direct dependencies may come from git or tarball URLs.
blockExoticSubdeps: true
# Refuse versions whose publish trust (trusted publisher / provenance) is lower than earlier releases.
trustPolicy: no-downgrade

# Grandfathered: versions already in the lockfile when minimumReleaseAge was enabled
# (2026-10-31). All were published on or before 2026-10-28, so they are older than 14 days
# by 2026-11-11. Delete this list after that date; it is not needed for new installs.
minimumReleaseAgeExclude:
  - "@astrojs/check@0.9.12"
  - "@astrojs/language-server@2.17.3"
  - "@astrojs/markdown-remark@7.3.5"
  - "@astrojs/markdown-satteri@0.4.6"
